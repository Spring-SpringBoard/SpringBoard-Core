name: Luacheck

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true


      - name: Install luacheck
        run: |
          python3 -m pip install hererocks
          python3 -m hererocks env --lua 5.1 --no-readline -rlatest
          source env/bin/activate
          luarocks install luacheck

      - name: Run luacheck
        run: |
          source env/bin/activate
          luacheck scen_edit triggers libs_sb/utils libs_sb/savetable.lua --enable 1

      - name: Run Lua command-bridge tests
        run: |
          source env/bin/activate
          lua tools/lua_tests/command_bridge_test.lua

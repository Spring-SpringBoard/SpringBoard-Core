[package]
name = "rust_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
spring-native = { path = "/home/gajop/projects/spring-projects/spring-bar/rust/crates/spring-native" }
log = "0.4.30"
log4rs = "1.4.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.15.1"
serde_yaml = "0.9.34"
anyhow = "1.0.102"
inventory = "0.3.24"
thiserror = "2.0.18"
ctrl_macros = "0.1.0"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "tga"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

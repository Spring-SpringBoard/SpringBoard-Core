[project]
name = "springboard-tools"
version = "0.1.0"
description = "Development, packaging, smoke, and graphical E2E tools for SpringBoard"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pillow>=11.0",
    "typer>=0.23.1",
]

[project.scripts]
sbc-e2e = "e2e.cli_e2e:app"
sbc-smoke = "smoke.cli_smoke:app"
sbc-lint = "lint.cli_lint:app"
sbc-packager = "sbc_packager.cli:main"
sbc-packager-base = "sbc_packager.editor.cli:main"
sbc-packager-application = "sbc_packager.application.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8",
    "ruff>=0.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["build/sbc_packager", "tools/e2e", "tools/smoke", "tools/lint"]

[tool.pytest.ini_options]
testpaths = ["tools/smoke"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

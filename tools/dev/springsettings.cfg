# Shadow resolution. The engine's default 2048 spread over the camera frustum puts a shadow
# texel several elmos across on these ships, which is wider than the panel relief they are
# supposed to shadow: every frame came back with horizontal acne banding across the shield face
# and no actual self-shadowing. Measured on the turntable, acne over the shadows-off baseline
# halves with each doubling -- +0.0040 local contrast at 2048, +0.0015 at 4096, +0.0003 at 8192,
# which is nothing. 8192 is where the stripes stop.
ShadowMapSize = 8192
# Full shadows, not the engine's default of 2.
#
# 2 is documented as "fast (skip terrain)", but what it actually does is clear whichever
# shadow-gen bit equals its own value, and in this build that is the model bit. Measured on the
# turntable, Shadows = 2 is pixel-for-pixel identical to no shadows at all -- same local contrast,
# same median -- while Shadows = 1 darkens about a sixth of the lit pixels. There is no terrain
# worth skipping here: these ships are the only thing in the frame.
Shadows = 1
